version: "3.9"
services:
  amrum-fe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amrum-fe-dev
    ports:
      - "6333:8080"  # Frontend dev server port
    volumes:
      # Mount source code for hot-reload during development
      - ./src:/app/src
      - ./public:/app/public
      - ./vue.config.js:/app/vue.config.js
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      # Exclude node_modules to use container's installed dependencies
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - VUE_APP_API_BASE_URL=http://localhost:6500
    restart: unless-stopped
    stdin_open: true  # Keep STDIN open for Vue CLI
    tty: true  # Allocate a pseudo-TTY
